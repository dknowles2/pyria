<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pyria Builder</title>
  <style>:root {
  --bg-primary: var(--color-background-primary, #0f1117);
  --bg-secondary: var(--color-background-secondary, #171a23);
  --bg-tertiary: var(--color-background-tertiary, #1f2430);
  --bg-info: var(--color-background-info, rgba(56, 139, 253, 0.14));
  --bg-success: var(--color-background-success, rgba(46, 160, 67, 0.16));
  --bg-warning: var(--color-background-warning, rgba(210, 153, 34, 0.16));
  --bg-danger: var(--color-background-danger, rgba(248, 81, 73, 0.16));

  --fg-primary: var(--color-text-primary, #e6edf3);
  --fg-secondary: var(--color-text-secondary, #9da7b3);
  --fg-tertiary: var(--color-text-tertiary, #768390);
  --fg-info: var(--color-text-info, #58a6ff);
  --fg-success: var(--color-text-success, #3fb950);
  --fg-warning: var(--color-text-warning, #d29922);
  --fg-danger: var(--color-text-danger, #f85149);

  --border-primary: var(--color-border-primary, #2c3342);
  --border-secondary: var(--color-border-secondary, #232836);
  --ring-primary: var(--color-ring-primary, #58a6ff);

  --font-ui: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm: 6px;
  --radius-md: 8px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--fg-primary);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.45;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 100vh;
}

.boot-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 6px;
  color: var(--fg-secondary);
}

.boot-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--fg-primary);
}

/* Header */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-primary);
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14px;
}

.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--fg-info);
  display: inline-block;
}

.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.tab-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--fg-secondary);
  padding: 4px 9px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.tab-btn:hover {
  background: var(--bg-tertiary);
  color: var(--fg-primary);
}

.tab-btn.active {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--border-primary);
}

/* Buttons & Badges */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--fg-primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--fg-info);
}

.btn-success {
  background: var(--bg-success);
  color: var(--fg-success);
  border-color: var(--fg-success);
}

.btn-danger {
  background: var(--bg-danger);
  color: var(--fg-danger);
  border-color: var(--fg-danger);
}

.btn-sm {
  padding: 3px 7px;
  font-size: 11px;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--fg-secondary);
}

.badge-info {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: transparent;
}

.badge-warn {
  background: var(--bg-warning);
  color: var(--fg-warning);
  border-color: transparent;
}

.badge-success {
  background: var(--bg-success);
  color: var(--fg-success);
  border-color: transparent;
}

.badge-danger {
  background: var(--bg-danger);
  color: var(--fg-danger);
  border-color: transparent;
}

/* Toast / Banner */
.banner {
  padding: 6px 12px;
  font-size: 12px;
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.banner-info {
  background: var(--bg-info);
  color: var(--fg-info);
}

.banner-warn {
  background: var(--bg-warning);
  color: var(--fg-warning);
}

.banner-success {
  background: var(--bg-success);
  color: var(--fg-success);
}

.banner-danger {
  background: var(--bg-danger);
  color: var(--fg-danger);
}

/* Main workspace layout */
.workspace {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.sidebar {
  width: 225px;
  min-width: 190px;
  max-width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.era-bar {
  display: flex;
  gap: 4px;
  padding: 8px;
  border-bottom: 1px solid var(--border-secondary);
  flex-wrap: wrap;
}

.era-pill {
  flex: 1;
  text-align: center;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--fg-secondary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.era-pill.active {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--fg-info);
}

.realm-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.realm-item {
  width: 100%;
  text-align: left;
  padding: 7px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--fg-primary);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.realm-item:hover {
  background: var(--bg-tertiary);
}

.realm-item.active {
  background: var(--bg-tertiary);
  border-color: var(--fg-info);
}

.realm-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-weight: 600;
  font-size: 12px;
}

.realm-item-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--fg-secondary);
}

/* Main panel */
.main-pane {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Responsive collapse for narrow side pane (< 580px) */
@media (max-width: 580px) {
  .workspace {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    max-width: none;
    border-right: none;
    border-bottom: 1px solid var(--border-primary);
    max-height: 175px;
  }
  .realm-list {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .realm-item {
    min-width: 165px;
    flex-shrink: 0;
    border-color: var(--border-secondary);
    background: var(--bg-primary);
  }
}

/* Cards & Forms */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  margin: 0;
}

.card-subtitle {
  font-size: 11px;
  color: var(--fg-secondary);
}

.actions-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-secondary);
}

.field input[type="text"],
.field input[type="number"],
.field select,
.field textarea {
  width: 100%;
  background: var(--bg-primary);
  color: var(--fg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-family: var(--font-ui);
  font-size: 12px;
}

.field textarea {
  min-height: 58px;
  resize: vertical;
}

.field textarea.code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  min-height: 92px;
  line-height: 1.45;
  tab-size: 4;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: 2px solid var(--ring-primary);
  outline-offset: -1px;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--fg-primary);
  margin-top: 4px;
}

/* Trial pills */
.trial-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.trial-chip {
  padding: 5px 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--fg-primary);
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.trial-chip.active {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--fg-info);
  font-weight: 600;
}

/* Sub-tabs for starter code */
.subtabs {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
}

.subtab {
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--fg-secondary);
  font-size: 11px;
  cursor: pointer;
}

.subtab.active {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--fg-info);
  font-weight: 600;
}

/* Test output panel */
.test-result {
  border-radius: var(--radius-sm);
  padding: 10px;
  border: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.test-result.pass {
  background: var(--bg-success);
  border-color: var(--fg-success);
}

.test-result.fail {
  background: var(--bg-danger);
  border-color: var(--fg-danger);
}

.pip-box {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  font-size: 12px;
}

pre.output-pre {
  margin: 0;
  padding: 7px 9px;
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Tables / lists in Health & Catalog */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.data-table th,
.data-table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border-secondary);
}

.data-table th {
  color: var(--fg-secondary);
  font-weight: 600;
  font-size: 11px;
}

.warning-item {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-warning);
  border: 1px solid var(--fg-warning);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.muted {
  color: var(--fg-secondary);
}

/* Sprite & World Previewer */
.pixel-canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
}

.sprite-stage-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.sprite-canvas {
  width: 100%;
  max-width: 440px;
  height: auto;
}

.option-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.option-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-secondary);
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.choice-pill {
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--fg-primary);
  font-size: 11px;
  cursor: pointer;
}

.choice-pill:hover {
  background: var(--bg-tertiary);
}

.choice-pill.active {
  background: var(--bg-info);
  color: var(--fg-info);
  border-color: var(--fg-info);
  font-weight: 600;
}

.console-log {
  margin: 0;
  padding: 7px 9px;
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  max-height: 110px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.world-canvas-wrap {
  width: 100%;
  overflow: auto;
  display: flex;
  justify-content: center;
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: 6px;
}

.world-canvas {
  width: 100%;
  max-width: 720px;
  height: auto;
  cursor: pointer;
}

.world-controls-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: start;
}

@media (max-width: 520px) {
  .world-controls-grid {
    grid-template-columns: 1fr;
  }
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 34px);
  grid-template-rows: repeat(3, 30px);
  gap: 3px;
  justify-content: center;
}

.dpad-btn {
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--fg-primary);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dpad-btn:hover {
  background: var(--bg-info);
  color: var(--fg-info);
}

.dpad-empty {
  visibility: hidden;
}

.entity-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.entity-card {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

</style>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-title">Pyria Builder</div>
      <div class="boot-sub">Connecting to Antigravity host...</div>
    </div>
  </div>
