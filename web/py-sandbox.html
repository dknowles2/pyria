import sys

_PYRIA_BLOCKED_MODULES = frozenset({
    "js",
    "pyodide",
    "pyodide_js",
    "pyodide_ffi",
    "_pyodide",
    "_pyodide_core",
    "micropip",
})

class _PyriaImportBlocker:
    def find_spec(self, fullname, path=None, target=None):
        top = fullname.split(".", 1)[0]
        if top in _PYRIA_BLOCKED_MODULES:
            raise ImportError(
                f"Importing '{fullname}' is not allowed in Pyria's Python spellbook."
            )
        return None

_pyria_saved_meta_path = None
_pyria_saved_modules = None

def _pyria_enter_sandbox():
    global _pyria_saved_meta_path, _pyria_saved_modules
    blocker = _PyriaImportBlocker()
    _pyria_saved_meta_path = list(sys.meta_path)
    _pyria_saved_modules = {}
    for mod_name in list(sys.modules.keys()):
        if mod_name.split(".", 1)[0] in _PYRIA_BLOCKED_MODULES:
            _pyria_saved_modules[mod_name] = sys.modules.pop(mod_name)
    sys.meta_path[:] = [blocker] + [
        f for f in _pyria_saved_meta_path
        if "pyodide" not in type(f).__module__.lower()
        and "js" not in type(f).__name__.lower()
    ]

def _pyria_exit_sandbox():
    global _pyria_saved_meta_path, _pyria_saved_modules
    if _pyria_saved_meta_path is not None:
        sys.meta_path[:] = _pyria_saved_meta_path
        _pyria_saved_meta_path = None
    if _pyria_saved_modules is not None:
        sys.modules.update(_pyria_saved_modules)
        _pyria_saved_modules = None

import time as _pyria_time

class _PyriaStreamingBuffer:
    MAX_BYTES = 16384
    MAX_LINES = 200
    FLUSH_INTERVAL_SEC = 0.05
    FLUSH_CHUNK_BYTES = 512
    TRUNCATED_NOTICE = "\\n... (output truncated)"

    def __init__(self, emit_cb=None):
        self._emit = emit_cb
        self._parts = []
        self._pending = []
        self._total_bytes = 0
        self._total_lines = 0
        self._pending_bytes = 0
        self._truncated = False
        self._last_flush = 0.0

    def writable(self):
        return True

    def isatty(self):
        return False

    def write(self, s):
        if not isinstance(s, str):
            s = str(s)
        n = len(s)
        if n == 0 or self._truncated:
            return n

        remaining_bytes = self.MAX_BYTES - self._total_bytes
        remaining_lines = self.MAX_LINES - self._total_lines
        new_lines = s.count("\\n")

        if n > remaining_bytes or new_lines > remaining_lines:
            chunk = s[:max(0, remaining_bytes)]
            if chunk.count("\\n") > remaining_lines:
                kept = chunk.split("\\n")[:max(0, remaining_lines)]
                chunk = "\\n".join(kept)
            if chunk:
                self._parts.append(chunk)
                self._pending.append(chunk)
                self._total_bytes += len(chunk)
                self._total_lines += chunk.count("\\n")
                self._pending_bytes += len(chunk)
            self._parts.append(self.TRUNCATED_NOTICE)
            self._pending.append(self.TRUNCATED_NOTICE)
            self._truncated = True
            self.flush()
            return n

        self._parts.append(s)
        self._pending.append(s)
        self._total_bytes += n
        self._total_lines += new_lines
        self._pending_bytes += n

        now = _pyria_time.monotonic()
        if self._pending_bytes >= self.FLUSH_CHUNK_BYTES or (now - self._last_flush) >= self.FLUSH_INTERVAL_SEC:
            self.flush()
        return n

    def flush(self):
        if self._pending and self._emit is not None:
            chunk = "".join(self._pending)
            self._pending.clear()
            self._pending_bytes = 0
            self._last_flush = _pyria_time.monotonic()
            try:
                self._emit(chunk)
            except Exception:
                pass

    def getvalue(self):
        return "".join(self._parts)

def _pyria_single_construct_hint(token):
    if token in _PYRIA_CONSTRUCT_HINTS:
        return _PYRIA_CONSTRUCT_HINTS[token]
    if token.startswith("call:"):
        return f"Try calling '{token[5:]}()' in your spell!"
    if token.startswith("method_call:"):
        return f"Try calling the '.{token[12:]}()' method in your spell!"
    return f"Try using '{token}' in your spell to practice this Trial's concept!"

def _pyria_construct_hint(spec):
    parts = [p.strip() for p in str(spec).split("|") if p.strip()]
    if len(parts) <= 1:
        return _pyria_single_construct_hint(parts[0] if parts else str(spec))
    return _pyria_single_construct_hint(parts[0])

def _pyria_apply_variant_overrides(source_code, overrides):
    tree = ast.parse(source_code, "<your_spell>")
    remaining = dict(overrides)
    new_body = []
    for stmt in tree.body:
        if (
            isinstance(stmt, ast.Assign)
            and len(stmt.targets) == 1
            and isinstance(stmt.targets[0], ast.Name)
            and stmt.targets[0].id in remaining
        ):
            var_name = stmt.targets[0].id
            val_expr = ast.parse(repr(remaining.pop(var_name)), mode="eval").body
            new_stmt = ast.Assign(targets=stmt.targets, value=val_expr)
            ast.copy_location(new_stmt, stmt)
            ast.fix_missing_locations(new_stmt)
            new_body.append(new_stmt)
        elif (
            isinstance(stmt, ast.AnnAssign)
            and isinstance(stmt.target, ast.Name)
            and stmt.target.id in remaining
            and stmt.value is not None
        ):
            var_name = stmt.target.id
            val_expr = ast.parse(repr(remaining.pop(var_name)), mode="eval").body
            new_stmt = ast.AnnAssign(
                target=stmt.target,
                annotation=stmt.annotation,
                value=val_expr,
                simple=stmt.simple,
            )
            ast.copy_location(new_stmt, stmt)
            ast.fix_missing_locations(new_stmt)
            new_body.append(new_stmt)
        else:
            new_body.append(stmt)
    tree.body = new_body
    ast.fix_missing_locations(tree)
    return compile(tree, "<your_spell>", "exec")

def _pyria_values_match(actual, expected):
    if isinstance(actual, float) and isinstance(expected, (int, float)) and not isinstance(expected, bool):
        return math.isclose(actual, float(expected), rel_tol=1e-6, abs_tol=1e-6)
    if isinstance(expected, float) and isinstance(actual, (int, float)) and not isinstance(actual, bool):
        return math.isclose(float(actual), expected, rel_tol=1e-6, abs_tol=1e-6)
    return actual == expected

def _pyria_run_trial(payload_json, emit_stdout=None):
    payload = json.loads(payload_json)
    student_code = payload.get("studentCode", "")
    test_code = payload.get("testCode", "")
    required_constructs = payload.get("requiredConstructs") or []
    variants = payload.get("variants") or []

    ns = {
        "say": print,
        "shout": _pyria_shout,
    }
    buf = _PyriaStreamingBuffer(emit_stdout)
    err_buf = io.StringIO()
    stage = "student"
    try:
        student_ast = ast.parse(student_code, "<your_spell>")
        with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(err_buf):
            exec(compile(student_ast, "<your_spell>", "exec"), ns)
        buf.flush()
        ns["OUTPUT"] = buf.getvalue()
        stage = "test"
        if test_code:
            with contextlib.redirect_stderr(err_buf):
                exec(compile(test_code, "<trial_check>", "exec"), ns)

        stage = "constructs"
        if isinstance(required_constructs, list):
            for spec in required_constructs:
                if not _pyria_has_construct(student_ast, spec):
                    raise AssertionError(_pyria_construct_hint(spec))

        stage = "variants"
        if isinstance(variants, list):
            for variant in variants:
                if not isinstance(variant, dict):
                    continue
                overrides = variant.get("overrides") or {}
                if not isinstance(overrides, dict):
                    overrides = {}
                default_msg = (
                    variant.get("message")
                    or "Pip tested your spell with different starting values and got a different result! Make sure your code uses the variables instead of typing the final answer directly."
                )
                variant_code = _pyria_apply_variant_overrides(student_code, overrides)
                variant_ns = {
                    "say": print,
                    "shout": _pyria_shout,
                }
                variant_ns.update(copy.deepcopy(overrides))
                v_buf = io.StringIO()
                v_err = io.StringIO()
                try:
                    with contextlib.redirect_stdout(v_buf), contextlib.redirect_stderr(v_err):
                        exec(variant_code, variant_ns)
                except Exception:
                    raise AssertionError(default_msg)
                v_out = v_buf.getvalue()
                variant_ns["OUTPUT"] = v_out

                if "expectOutput" in variant and variant["expectOutput"] is not None:
                    actual_norm = v_out.replace("\\r\\n", "\\n").strip()
                    expect_norm = str(variant["expectOutput"]).replace("\\r\\n", "\\n").strip()
                    if actual_norm != expect_norm:
                        raise AssertionError(default_msg)

                expect_vars = variant.get("expectVars")
                if isinstance(expect_vars, dict):
                    for k, expected_val in expect_vars.items():
                        if k not in variant_ns or not _pyria_values_match(variant_ns[k], expected_val):
                            raise AssertionError(default_msg)

                v_test = variant.get("testCode")
                if isinstance(v_test, str) and v_test.strip():
                    try:
                        with contextlib.redirect_stderr(v_err):
                            exec(compile(v_test, "<variant_check>", "exec"), variant_ns)
                    except AssertionError as ae:
                        raise AssertionError(str(ae) or default_msg)
                    except Exception:
                        raise AssertionError(default_msg)

        return json.dumps({
            "passed": True,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "errorType": None,
            "errorMessage": None,
            "errorLine": None,
            "rawTraceback": None,
            "stage": "done",
        })
    except SyntaxError as e:
        buf.flush()
        return json.dumps({
            "passed": False,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "errorType": type(e).__name__,
            "errorMessage": e.msg or str(e),
            "errorLine": e.lineno,
            "rawTraceback": traceback.format_exc(),
            "stage": stage,
        })
    except Exception as e:
        buf.flush()
        tb = e.__traceback__
        line_no = None
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<your_spell>":
                line_no = tb.tb_lineno
            tb = tb.tb_next
        return json.dumps({
            "passed": False,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "errorType": type(e).__name__,
            "errorMessage": str(e),
            "errorLine": line_no,
            "rawTraceback": traceback.format_exc(),
            "stage": stage,
        })

    purchased = []
    equipped = []

    by_id = {item["id"]: item for item in unlockables}

    def _buy_or_use(item_id, label):
        item = by_id.get(item_id)
        if not item:
            raise ValueError(f"Bram scratches his beard: I don't have a blueprint for '{label}'!")
        if item_id in owned:
            return item, False
        cost = int(item.get("shardCost", 0))
        if shards[0] < cost:
            raise ValueError(
                f"Not enough Byte Shards for {item['name']}! You need {cost} Shards, but you have {shards[0]}."
            )
        shards[0] -= cost
        owned.append(item_id)
        purchased.append(item["name"])
        return item, True

    def wear_hat(hat_name):
        if not isinstance(hat_name, str):
            raise TypeError('wear_hat() needs a quoted hat name, like wear_hat("explorer")')
        key = hat_name.strip().lower()
        if key in ("none", "off", ""):
            appearance["hat"] = None
            equipped.append("Hat removed")
            print("Took off hat.")
            return
        mapping = {
            "explorer": ("hat-explorer", "hat_explorer"),
            "dragon_helm": ("hat-dragon-helm", "hat_dragon_helm"),
            "wizard_cap": ("hat-wizard-cap", "hat_wizard_cap"),
        }
        if key not in mapping:
            raise ValueError(f"Unknown hat '{hat_name}'. Try: explorer, dragon_helm, wizard_cap, or none")
        item_id, sprite_key = mapping[key]
        item, bought = _buy_or_use(item_id, hat_name)
        appearance["hat"] = sprite_key
        equipped.append(item["name"])
        verb = "Forged and equipped" if bought else "Equipped"
        print(f"{verb} {item['name']}! ({shards[0]} Shards left)")

    def set_tunic_color(color):
        if not isinstance(color, str):
            raise TypeError('set_tunic_color() needs a quoted color, like set_tunic_color("crimson")')
        key = color.strip().lower()
        paid_map = {
            "crimson": "tunic-crimson",
            "navy": "tunic-navy",
        }
        free_colors = {"emerald", "amber", "violet", "slate"}
        if key in paid_map:
            if appearance.get("tunic") == key:
                print(f"Already wearing the {key} tunic!")
                return
            item, bought = _buy_or_use(paid_map[key], color)
            appearance["tunic"] = key
            equipped.append(item["name"])
            verb = "Dyed and equipped" if bought else "Equipped"
            print(f"{verb} {item['name']}! ({shards[0]} Shards left)")
        elif key in free_colors:
            appearance["tunic"] = key
            equipped.append(f"{key} tunic")
            print(f"Switched tunic color to {key}!")
        else:
            raise ValueError(f"Unknown tunic color '{color}'. Try: emerald, crimson, navy, amber, violet, slate")

    def equip_boots(boots_name):
        if not isinstance(boots_name, str):
            raise TypeError('equip_boots() needs a quoted name, like equip_boots("swift")')
        key = boots_name.strip().lower()
        if key in ("default", "normal", "none"):
            appearance["boots"] = "boots_default"
            equipped.append("Starter Boots")
            print("Equipped Starter Boots.")
            return
        if key != "swift":
            raise ValueError(f"Unknown boots '{boots_name}'. Try: swift or default")
        item, bought = _buy_or_use("boots-swift", boots_name)
        appearance["boots"] = "boots_swift"
        equipped.append(item["name"])
        verb = "Forged and equipped" if bought else "Equipped"
        print(f"{verb} {item['name']}! Walk speed boosted! ({shards[0]} Shards left)")

    def equip_shield(shield_name):
        if not isinstance(shield_name, str):
            raise TypeError('equip_shield() needs a quoted name, like equip_shield("oak")')
        key = shield_name.strip().lower()
        if key in ("none", "off", ""):
            appearance["shield"] = None
            equipped.append("Shield unequipped")
            print("Put away shield.")
            return
        mapping = {
            "oak": ("shield-oak", "shield_oak"),
            "coral": ("shield-coral", "shield_coral"),
        }
        if key not in mapping:
            raise ValueError(f"Unknown shield '{shield_name}'. Try: oak, coral, or none")
        item_id, sprite_key = mapping[key]
        item, bought = _buy_or_use(item_id, shield_name)
        appearance["shield"] = sprite_key
        equipped.append(item["name"])
        verb = "Forged and equipped" if bought else "Equipped"
        print(f"{verb} {item['name']}! ({shards[0]} Shards left)")

    def equip_cloak(cloak_name):
        if not isinstance(cloak_name, str):
            raise TypeError('equip_cloak() needs a quoted name, like equip_cloak("tide")')
        key = cloak_name.strip().lower()
        if key in ("none", "off", ""):
            appearance["cloak"] = None
            equipped.append("Cloak removed")
            print("Removed cloak.")
            return
        if key != "tide":
            raise ValueError(f"Unknown cloak '{cloak_name}'. Try: tide or none")
        item, bought = _buy_or_use("cloak-tide", cloak_name)
        appearance["cloak"] = "cloak_tide"
        equipped.append(item["name"])
        verb = "Wove and equipped" if bought else "Equipped"
        print(f"{verb} {item['name']}! ({shards[0]} Shards left)")

    def add_charisma(amount=1):
        if not isinstance(amount, int) or amount < 1:
            raise ValueError("add_charisma() needs a positive whole number, like add_charisma(1)")
        item, bought = _buy_or_use("stat-charisma-1", "charisma")
        if bought:
            stats["charisma"] = int(stats.get("charisma", 0)) + amount
        appearance["aura"] = "aura_charisma_1"
        equipped.append(item["name"])
        verb = "Unlocked" if bought else "Activated"
        print(f"{verb} {item['name']}! Charisma is now {stats['charisma']}. ({shards[0]} Shards left)")

    def add_courage(amount=1):
        if not isinstance(amount, int) or amount < 1:
            raise ValueError("add_courage() needs a positive whole number, like add_courage(1)")
        item, bought = _buy_or_use("stat-courage-1", "courage")
        if bought:
            stats["courage"] = int(stats.get("courage", 0)) + amount
        appearance["aura"] = "aura_courage_1"
        equipped.append(item["name"])
        verb = "Unlocked" if bought else "Activated"
        print(f"{verb} {item['name']}! Courage is now {stats['courage']}. ({shards[0]} Shards left)")

    def equip_pip_scarf(scarf_name):
        if not isinstance(scarf_name, str):
            raise TypeError('equip_pip_scarf() needs a quoted name, like equip_pip_scarf("ember")')
        key = scarf_name.strip().lower()
        if key in ("none", "off", ""):
            appearance["pipScarf"] = None
            equipped.append("Pip scarf removed")
            print("Took off Pip's scarf.")
            return
        if key != "ember":
            raise ValueError(f"Unknown Pip scarf '{scarf_name}'. Try: ember or none")
        item, bought = _buy_or_use("pip-scarf-ember", scarf_name)
        appearance["pipScarf"] = "pip_scarf_ember"
        equipped.append(item["name"])
        verb = "Stitched and equipped" if bought else "Equipped"
        print(f"{verb} {item['name']}! Pip chirps happily! ({shards[0]} Shards left)")

    def get_shards():
        return shards[0]

    def forge_arrows(count=1):
        if not isinstance(count, int) or isinstance(count, bool) or count < 1 or count > 50:
            raise ValueError("forge_arrows() needs a whole number from 1 to 50, like forge_arrows(5)")
        cost = 5 * count
        if shards[0] < cost:
            raise ValueError(
                f"Not enough Byte Shards for {count} Dragon Arrow(s)! You need {cost} Shards, but you have {shards[0]}."
            )
        shards[0] -= cost
        inventory["arrows"] = int(inventory.get("arrows", 0)) + count
        purchased.append(f"{count}x Dragon Arrows")
        print(f"Forged {count} Dragon Arrow(s)! Total arrows: {inventory['arrows']}. ({shards[0]} Shards left)")

    def brew_potion(count=1):
        if not isinstance(count, int) or isinstance(count, bool) or count < 1 or count > 50:
            raise ValueError("brew_potion() needs a whole number from 1 to 50, like brew_potion(2)")
        cost = 10 * count
        if shards[0] < cost:
            raise ValueError(
                f"Not enough Byte Shards for {count} Starlight Potion(s)! You need {cost} Shards, but you have {shards[0]}."
            )
        shards[0] -= cost
        inventory["potions"] = int(inventory.get("potions", 0)) + count
        purchased.append(f"{count}x Starlight Potions")
        print(f"Brewed {count} Starlight Potion(s)! Total potions: {inventory['potions']}. ({shards[0]} Shards left)")

    def forge_custom(item_or_name, power=1):
        if isinstance(item_or_name, str):
            name = item_or_name.strip()
            pwr = power
            elem = None
        elif hasattr(item_or_name, "name"):
            name = str(getattr(item_or_name, "name", "")).strip()
            pwr = getattr(item_or_name, "power", power)
            elem = getattr(item_or_name, "element", None)
        else:
            raise TypeError('forge_custom() needs an item name (like forge_custom("Flame Blade", 5)) or an object with a .name attribute!')
        if not name or len(name) > 40:
            raise ValueError("Custom item name must be between 1 and 40 characters!")
        if not isinstance(pwr, int) or isinstance(pwr, bool) or pwr < 1:
            raise ValueError("Custom item power must be a positive whole number, like 5!")
        elem_clean = str(elem).strip() if elem is not None and str(elem).strip() else None
        if elem_clean is not None and len(elem_clean) > 24:
            raise ValueError("Custom item element must be 24 characters or fewer!")
        if len(custom_items) >= 20:
            raise ValueError("Bram's trophy shelf is full (max 20 custom forged items)!")
        cost = 15
        if shards[0] < cost:
            raise ValueError(
                f"Not enough Byte Shards to forge '{name}'! You need {cost} Shards, but you have {shards[0]}."
            )
        shards[0] -= cost
        label = f"{name} ({elem_clean}, Power {pwr})" if elem_clean else f"{name} (Power {pwr})"
        custom_items.append(label)
        purchased.append(label)
        print(f"Bram cheers: Magnificent craft! Forged {label}! ({shards[0]} Shards left)")

    ns = {
        "wear_hat": wear_hat,
        "set_tunic_color": set_tunic_color,
        "equip_boots": equip_boots,
        "equip_shield": equip_shield,
        "equip_cloak": equip_cloak,
        "add_charisma": add_charisma,
        "add_courage": add_courage,
        "equip_pip_scarf": equip_pip_scarf,
        "get_shards": get_shards,
        "forge_arrows": forge_arrows,
        "brew_potion": brew_potion,
        "forge_custom": forge_custom,
    }
    buf = _PyriaStreamingBuffer(emit_stdout)
    err_buf = io.StringIO()
    try:
        with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(err_buf):
            exec(compile(code, "<bram_workshop>", "exec"), ns)
        buf.flush()
        return json.dumps({
            "passed": True,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "appearance": appearance,
            "stats": stats,
            "ownedUnlockIds": owned,
            "byteShards": shards[0],
            "purchased": purchased,
            "equipped": equipped,
            "inventory": inventory,
            "customItems": custom_items,
            "errorType": None,
            "errorMessage": None,
            "errorLine": None,
            "rawTraceback": None,
        })
    except SyntaxError as e:
        return json.dumps({
            "passed": False,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "errorType": type(e).__name__,
            "errorMessage": e.msg or str(e),
            "errorLine": e.lineno,
            "rawTraceback": traceback.format_exc(),
        })
    except Exception as e:
        tb = e.__traceback__
        line_no = None
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<bram_workshop>":
                line_no = tb.tb_lineno
            tb = tb.tb_next
        return json.dumps({
            "passed": False,
            "stdout": buf.getvalue(),
            "stderr": err_buf.getvalue(),
            "errorType": type(e).__name__,
            "errorMessage": str(e),
            "errorLine": line_no,
            "rawTraceback": traceback.format_exc(),
        })
`;

  function buildWorkerSource() {
    return [
      `'use strict';`,
      `const PYODIDE_URL = ${JSON.stringify(PYODIDE_URL)};`,
      `const PYODIDE_INDEX = ${JSON.stringify(PYODIDE_INDEX)};`,
      `const SANDBOX_GUARD_PY = ${JSON.stringify(SANDBOX_GUARD_PY)};`,
      `const TRIAL_HARNESS_PY = ${JSON.stringify(TRIAL_HARNESS_PY)};`,
      `const CHARCREATE_HARNESS_PY = ${JSON.stringify(CHARCREATE_HARNESS_PY)};`,
      `const WORKSHOP_HARNESS_PY = ${JSON.stringify(WORKSHOP_HARNESS_PY)};`,
      `
let pyodide = null;
let initPromise = null;
let harnessesPromise = null;

async function ensurePyodide() {
  if (pyodide) return pyodide;
  if (!initPromise) {
    initPromise = (async () => {
      importScripts(PYODIDE_URL);
      const instance = await self.loadPyodide({ indexURL: PYODIDE_INDEX });
      pyodide = instance;
      self.postMessage({ type: 'ready' });
      return instance;
    })().catch((err) => {
      initPromise = null;
      self.postMessage({
        type: 'init_error',
        error: err && err.message ? err.message : String(err),
      });
      throw err;
    });
  }
  return initPromise;
}

async function loadHarnesses(py) {
  if (!harnessesPromise) {
    harnessesPromise = (async () => {
      await py.runPythonAsync(SANDBOX_GUARD_PY);
      await py.runPythonAsync(TRIAL_HARNESS_PY);
      await py.runPythonAsync(CHARCREATE_HARNESS_PY);
      await py.runPythonAsync(WORKSHOP_HARNESS_PY);
    })().catch((err) => {
      harnessesPromise = null;
      throw err;
    });
  }
  return harnessesPromise;
}

ensurePyodide().catch(() => {});

self.onmessage = async (event) => {
  const msg = event.data;
  if (!msg || typeof msg.id !== 'number') return;

  try {
    const py = await ensurePyodide();
    await loadHarnesses(py);

    const payloadJson = JSON.stringify(msg.payload || {});
    py.globals.set('_pyria_payload_json', payloadJson);
    const emitStdout = (chunk) => {
      if (typeof chunk === 'string' && chunk.length > 0) {
        self.postMessage({ type: 'stdout', id: msg.id, chunk });
      }
    };
    py.globals.set('_pyria_emit_stdout', emitStdout);

    let fnName = '_pyria_run_trial';
    if (msg.mode === 'charcreate') fnName = '_pyria_run_charcreate';
    else if (msg.mode === 'workshop') fnName = '_pyria_run_workshop';

    let resultJson;
    py.runPython('_pyria_enter_sandbox()');
    try {
      resultJson = py.runPython(fnName + '(_pyria_payload_json, _pyria_emit_stdout)');
    } finally {
      py.runPython('_pyria_exit_sandbox()');
      py.globals.delete('_pyria_payload_json');
      py.globals.delete('_pyria_emit_stdout');
    }

    self.postMessage({
      type: 'result',
      id: msg.id,
      result: JSON.parse(resultJson),
    });
  } catch (err) {
    self.postMessage({
      type: 'result',
      id: msg.id,
      result: {
        passed: false,
        stdout: '',
        stderr: '',
        errorType: 'RuntimeError',
        errorMessage: err && err.message ? err.message : String(err),
        errorLine: null,
        rawTraceback: String(err),
      },
    });
  }
};
`,
    ].join('\n');
  }

  let port = null;
  let worker = null;
  let workerBlobUrl = null;
  const pendingOutbox = [];

  function sendToParent(msg) {
    if (port) {
      port.postMessage(msg);
    } else {
      pendingOutbox.push(msg);
    }
  }

  function revokeBlobUrl() {
    if (workerBlobUrl) {
      try {
        URL.revokeObjectURL(workerBlobUrl);
      } catch {
        // ignore
      }
      workerBlobUrl = null;
    }
  }

  function terminateWorker() {
    revokeBlobUrl();
    if (worker) {
      try {
        worker.terminate();
      } catch {
        // ignore
      }
      worker = null;
    }
  }

  function startRuntime() {
    try {
      const blob = new Blob([buildWorkerSource()], { type: 'application/javascript' });
      workerBlobUrl = URL.createObjectURL(blob);
      const w = new Worker(workerBlobUrl);
      w.onmessage = (event) => {
        revokeBlobUrl();
        const data = event.data;
        if (!data || typeof data.type !== 'string') return;
        if (
          data.type === 'ready' ||
          data.type === 'init_error' ||
          data.type === 'result' ||
          data.type === 'stdout'
        ) {
          sendToParent(data);
        }
      };
      w.onerror = (err) => {
        terminateWorker();
        sendToParent({
          type: 'init_error',
          error: (err && err.message) || 'Sandbox worker failed',
        });
      };
      worker = w;
    } catch (err) {
      // Fail closed: never run untrusted Python on the iframe's window thread,
      // where an infinite loop could freeze the parent page's event loop.
      terminateWorker();
      sendToParent({
        type: 'init_error',
        error: (err && err.message) || 'Sandbox Web Worker is unavailable in this browser',
      });
    }
  }

  window.addEventListener('pagehide', terminateWorker);
  startRuntime();

  function onInitMessage(event) {
    if (event.source !== window.parent) return;
    const data = event.data;
    if (!data || data.type !== 'pyria:init') return;
    if (!event.ports || event.ports.length !== 1) return;

    window.removeEventListener('message', onInitMessage);
    port = event.ports[0];

    port.onmessage = (portEvent) => {
      const msg = portEvent.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'terminate') {
        terminateWorker();
        return;
      }
      if (msg.type !== 'run' || typeof msg.id !== 'number') return;
      if (!worker) {
        sendToParent({
          type: 'result',
          id: msg.id,
          result: {
            passed: false,
            stdout: '',
            stderr: '',
            errorType: 'SandboxError',
            errorMessage: 'Sandbox Web Worker is unavailable',
            errorLine: null,
            rawTraceback: null,
          },
        });
        return;
      }
      worker.postMessage({
        id: msg.id,
        mode: msg.mode,
        payload: msg.payload,
      });
    };

    while (pendingOutbox.length > 0) {
      port.postMessage(pendingOutbox.shift());
    }
  }

  window.addEventListener('message', onInitMessage);
})();
</script>
