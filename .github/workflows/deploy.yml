name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Pre-Deploy Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build:assets

      - name: Typecheck Worker TypeScript
        run: npm run typecheck

      - name: Run Worker + D1 tests
        run: npm test

      - name: Run Web JS tests
        run: npm run test:web

      - name: Validate content integrity
        run: npm run test:content

      - name: Parse-check every browser JS module
        run: npm run test:parse

      - name: Check player-facing text against rule 0
        run: npm run test:text

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build:assets

      - name: Apply D1 migrations and deploy Workers
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not configured; skipping deploy."
            exit 0
          fi
          npx wrangler d1 migrations apply pyria-db --remote
          npx wrangler deploy
          npx wrangler deploy -c wrangler.site.jsonc
